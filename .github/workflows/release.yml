name: Release

# Pushing a tag runs the full test matrix, publishes the extension to the
# VS Code Marketplace with the VSCE_PAT secret, and attaches the .vsix to a
# GitHub release.
#
#   v0.1.0          -> stable release
#   v0.1.0-alpha.1  -> pre-release (users pick "Install Pre-Release Version")
#
# The part before the first "-" must equal the version in package.json. The
# Marketplace only accepts plain major.minor.patch versions, so the suffix is
# only used to flag the release as pre-release. By Marketplace convention the
# pre-release line uses odd minor versions (0.1.x) and stable uses even (0.2.x).

on:
  push:
    tags:
      - "v*"
  # Manual run from the Actions page: creates the tag and releases from it.
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to create and release, e.g. v0.1.0-alpha.1"
        required: true

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Resolve release tag
        id: tag
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            tag="${{ github.event.inputs.tag }}"
            # A manual run (re)points the tag at the commit being released, so
            # a failed attempt can be retried with the same tag.
            git tag -f "$tag"
            git push -f origin "refs/tags/$tag"
          else
            tag="${GITHUB_REF_NAME}"
          fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci

      - name: Check tag matches package.json version, detect pre-release
        id: ver
        run: |
          tag="${{ steps.tag.outputs.tag }}"
          pkg="v$(node -p "require('./package.json').version")"
          base="${tag%%-*}"
          if [ "$pkg" != "$base" ]; then
            echo "tag ${tag} does not match package.json version ${pkg}" >&2
            exit 1
          fi
          if [ "$base" != "$tag" ]; then
            echo "prerelease=true" >> "$GITHUB_OUTPUT"
            echo "flag=--pre-release" >> "$GITHUB_OUTPUT"
          else
            echo "prerelease=false" >> "$GITHUB_OUTPUT"
            echo "flag=" >> "$GITHUB_OUTPUT"
          fi

      - run: npm test
      - run: xvfb-run -a npm run test:vscode
      - name: Install Neovim
        run: |
          curl -sSL -o nvim.tar.gz https://github.com/neovim/neovim/releases/latest/download/nvim-linux-x86_64.tar.gz
          tar xzf nvim.tar.gz
          echo "$PWD/nvim-linux-x86_64/bin" >> "$GITHUB_PATH"
      - run: npm run test:lua

      - name: Package
        run: npx vsce package --no-dependencies ${{ steps.ver.outputs.flag }}

      - name: Publish to VS Code Marketplace
        run: npx vsce publish --no-dependencies ${{ steps.ver.outputs.flag }} --packagePath ./*.vsix
        env:
          VSCE_PAT: ${{ secrets.VSCE_PAT }}

      - name: Publish to Open VSX (only if OVSX_PAT is set)
        if: ${{ env.OVSX_PAT != '' }}
        run: npx ovsx publish ./*.vsix -p "$OVSX_PAT" ${{ steps.ver.outputs.flag }}
        env:
          OVSX_PAT: ${{ secrets.OVSX_PAT }}

      - name: GitHub release with the .vsix
        uses: softprops/action-gh-release@v2
        with:
          files: "*.vsix"
          tag_name: ${{ steps.tag.outputs.tag }}
          generate_release_notes: true
          prerelease: ${{ steps.ver.outputs.prerelease == 'true' }}
